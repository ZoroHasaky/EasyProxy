name: Release

on:
  push:
    branches: [master]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION | tr -d ' \n')
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          if [ "v$VERSION" != "$LATEST" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  binaries:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build binary
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(cat ../VERSION | tr -d ' \n')
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o /tmp/easyproxy ./cmd/server
          cd /tmp
          tar -czf "easyproxy-linux-${{ matrix.goarch }}.tar.gz" easyproxy
          sha256sum "easyproxy-linux-${{ matrix.goarch }}.tar.gz" > "easyproxy-linux-${{ matrix.goarch }}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyproxy-linux-${{ matrix.goarch }}
          path: |
            /tmp/easyproxy-linux-${{ matrix.goarch }}.tar.gz
            /tmp/easyproxy-linux-${{ matrix.goarch }}.tar.gz.sha256

  docker:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name (ghcr requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:v${{ needs.gate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [gate, binaries]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # 只取二进制包；不带 pattern 会连 buildx 的 *.dockerbuild 记录 artifact 一起抓，导致下载失败
          pattern: easyproxy-linux-*
      - name: Generate docker-compose.yml
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          sed -e "s|__IMAGE__|${IMAGE}|" -e "s|__VERSION__|v${VERSION}|" \
            deploy/docker-compose.release.yml > docker-compose.yml
          cat docker-compose.yml
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          gh release create "v$VERSION" dist/* docker-compose.yml \
            --title "v$VERSION" \
            --generate-notes
