name: Release

on:
  push:
    branches: [master]

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
      - name: Check VERSION changed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION | tr -d ' \n')
          LATEST=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || echo "")
          if [ "v$VERSION" != "$LATEST" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  binaries:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build binary
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(cat ../VERSION | tr -d ' \n')
          cp -a ../frontend/dist/. ./internal/web/dist/
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o /tmp/easyproxy ./cmd/server
          cd /tmp
          tar -czf "easyproxy-linux-${{ matrix.goarch }}.tar.gz" easyproxy
          sha256sum "easyproxy-linux-${{ matrix.goarch }}.tar.gz" > "easyproxy-linux-${{ matrix.goarch }}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyproxy-linux-${{ matrix.goarch }}
          path: |
            /tmp/easyproxy-linux-${{ matrix.goarch }}.tar.gz
            /tmp/easyproxy-linux-${{ matrix.goarch }}.tar.gz.sha256

  docker:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name (ghcr requires lowercase)
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:v${{ needs.gate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop-windows:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build backend server
        shell: pwsh
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $version = (Get-Content ../VERSION).Trim()
          New-Item -ItemType Directory -Force -Path internal/web/dist | Out-Null
          Copy-Item -Recurse -Force ../frontend/dist/* internal/web/dist/
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o ../desktop/easyproxy-server.exe ./cmd/server
      - name: Build Wails desktop shell
        working-directory: desktop
        shell: pwsh
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 build -clean -platform windows/amd64
          New-Item -ItemType Directory -Force -Path build/bin/resources | Out-Null
          Copy-Item -Force easyproxy-server.exe build/bin/resources/easyproxy-server.exe
          Compress-Archive -Path build/bin/* -DestinationPath ../easyproxy-windows-amd64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: easyproxy-desktop-windows-amd64
          path: easyproxy-windows-amd64.zip

  desktop-macos:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            goarch: amd64
            label: intel
          - runner: macos-14
            goarch: arm64
            label: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build backend server
        working-directory: backend
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(tr -d ' \n' < ../VERSION)
          mkdir -p internal/web/dist
          cp -a ../frontend/dist/. internal/web/dist/
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o ../desktop/easyproxy-server ./cmd/server
      - name: Build Wails desktop shell
        working-directory: desktop
        run: |
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.16.0 build -clean -platform darwin/${{ matrix.goarch }}
          APP=$(find build/bin -maxdepth 1 -name '*.app' -type d | head -n 1)
          mkdir -p "$APP/Contents/Resources"
          cp easyproxy-server "$APP/Contents/Resources/easyproxy-server"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "../easyproxy-macos-${{ matrix.label }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: easyproxy-desktop-macos-${{ matrix.label }}
          path: easyproxy-macos-${{ matrix.label }}.zip

  release:
    needs: [gate, binaries, desktop-windows, desktop-macos]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # 只取 EasyProxy 二进制与桌面包，避免下载 buildx 的 *.dockerbuild 记录。
          pattern: easyproxy-*
      - name: Generate docker-compose.yml
        run: |
          cp deploy/docker-compose.release.yml docker-compose.yml
          cat docker-compose.yml
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.gate.outputs.version }}"
          gh release create "v$VERSION" dist/* docker-compose.yml \
            --title "v$VERSION" \
            --generate-notes
