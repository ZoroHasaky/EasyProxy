# EasyProxy 发布版 compose：随 GitHub Release 分发，镜像来自 ghcr，无需克隆仓库
# 使用：下载本文件（Release 中的 docker-compose.yml）放入任意目录，执行
#   docker compose up -d
#   面板: http://<host>:8080    初始密码: docker logs easyproxy
#   代理: http/socks5 <host>:7890
#
# ── 透明代理（TUN）模式：取消下面各行的注释，并注释掉 services.easyproxy 下的 ports: 段 ──
# 开启后 LAN 设备将网关/DNS 指向本机即可免配置走代理，再到面板「透明代理」页开启 TUN 开关
services:
  easyproxy:
    image: __IMAGE__:__VERSION__
    container_name: easyproxy
    # network_mode: host          # 必需：host 网络（与 ports 互斥，需一并注释）
    # cap_add:
    #   - NET_ADMIN               # 必需：创建 TUN 网卡的能力
    # devices:
    #   - /dev/net/tun:/dev/net/tun  # 必需：TUN 设备
    # 注：host 网络模式不允许 compose 设置 sysctl；如需转发请确认宿主机已开启
    # net.ipv4.ip_forward=1（多数发行版/PVE 默认已开启）
    ports:
      - "8080:8080" # 面板
      - "7890:7890" # 混合代理端口 (HTTP/SOCKS5)
    volumes:
      - ./data:/data
    restart: unless-stopped
