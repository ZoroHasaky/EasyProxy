<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 主背景深色渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- 品牌主色渐变（Indigo -> Violet -> Cyan） -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- 闪电渐变 -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- 辉光滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 边框微光渐变 -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- 圆角矩形底座 (iOS/macOS App Icon 规格) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#borderGrad)" stroke-width="3" opacity="0.6" />

  <!-- 内部抽象网络分流星环 / 节点流轨道 -->
  <g transform="translate(256, 256)">
    <!-- 外层动态轨道环 -->
    <circle r="160" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 16" />
    <circle r="120" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-opacity="0.35" />
    <circle r="80" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 8" />

    <!-- 节点脉冲光点 -->
    <circle cx="-113" cy="-113" r="7" fill="#38bdf8" filter="url(#subtleGlow)" />
    <circle cx="120" cy="0" r="8" fill="#818cf8" filter="url(#subtleGlow)" />
    <circle cx="-60" cy="104" r="6" fill="#c084fc" filter="url(#subtleGlow)" />
    <circle cx="56" cy="-56" r="5" fill="#34d399" filter="url(#subtleGlow)" />

    <!-- 节点连线 -->
    <path d="M -113 -113 Q -20 -60 56 -56" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
    <path d="M 56 -56 Q 100 -20 120 0" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.4" />
    <path d="M 120 0 Q 30 70 -60 104" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.4" />

    <!-- 核心能量盾形容器 / 路由枢纽 -->
    <path d="M 0 -95 L 75 -50 L 75 45 Q 75 100 0 125 Q -75 100 -75 45 L -75 -50 Z"
          fill="url(#primaryGrad)"
          opacity="0.25"
          filter="url(#glow)" />

    <path d="M 0 -90 L 70 -48 L 70 42 Q 70 94 0 118 Q -70 94 -70 42 L -70 -48 Z"
          fill="#1e1b4b"
          stroke="url(#primaryGrad)"
          stroke-width="4" />

    <!-- 核心能量闪电 (极速聚合与分流象征) -->
    <path d="M 6 -62 L -32 4 L 4 4 L -6 62 L 32 -4 L -4 -4 Z"
          fill="url(#boltGrad)"
          filter="url(#glow)" />
    <path d="M 6 -62 L -32 4 L 4 4 L -6 62 L 32 -4 L -4 -4 Z"
          fill="#ffffff" />
  </g>
</svg>
